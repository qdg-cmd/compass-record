<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 배경 둥근 타일 -->
  <rect width="1024" height="1024" rx="225" fill="url(#bgGrad)" />

  <!-- 외곽 링 & 나침반 다이얼 -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#ffffff" stroke-width="14" stroke-opacity="0.35" />
  <circle cx="512" cy="512" r="300" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="6" stroke-opacity="0.5" />

  <!-- 방위 눈금 (8방위) -->
  <line x1="512" y1="230" x2="512" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="512" y1="764" x2="512" y2="794" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="230" y1="512" x2="260" y2="512" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="764" y1="512" x2="794" y2="512" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <line x1="312" y1="312" x2="336" y2="336" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="712" y1="312" x2="688" y2="336" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="312" y1="712" x2="336" y2="688" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="712" y1="712" x2="688" y2="688" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- 나침반 바늘 (45도 기울어진 다이내믹 디자인) -->
  <g transform="rotate(45, 512, 512)" filter="url(#shadow)">
    <!-- 북쪽 뾰족 바늘 (레드) -->
    <polygon points="512,230 550,512 512,476" fill="url(#needleNorth)" />
    <polygon points="512,230 474,512 512,476" fill="#f87171" />

    <!-- 남쪽 뾰족 바늘 (화이트/실버) -->
    <polygon points="512,794 550,512 512,548" fill="url(#needleSouth)" />
    <polygon points="512,794 474,512 512,548" fill="#ffffff" />

    <!-- 중앙 피벗 핀 -->
    <circle cx="512" cy="512" r="32" fill="#0f172a" />
    <circle cx="512" cy="512" r="20" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- 하단 미니 북 심볼 (학생부 기록 상징) -->
  <g transform="translate(452, 700) scale(2.5)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
  </g>
</svg>
