<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>생기부 나침반 — 스마트 학교생활기록부 작성 도구</title>

    <!-- Pretendard Variable 웹 폰트 (고속 CDN & 깃허브 업로드 경량화) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- PWA 메타 태그 및 매니페스트 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="생기부 나침반" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      body {
        background-color: #f8fafc;
        color: #0f172a;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f8fafc;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(2, 132, 199, 0.25);
      }

      .loading-spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #0284c7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        font-size: 15px;
        font-weight: 600;
        color: #64748b;
        letter-spacing: -0.01em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/main-By95MT_X.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-26W15Z6R.css">
  </head>

  <body>
    <!-- Vue 마운트 전 표시되는 로딩 화면 -->
    <div id="app-loading">
      <img class="loading-logo" src="./app-icon.svg" alt="생기부 나침반">
      <div class="loading-spinner"></div>
      <span class="loading-text">생기부 나침반을 불러오는 중...</span>
    </div>

    <div id="app"></div>

    <!-- PWA 서비스 워커 등록 및 설치 프롬프트 연동 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
            .catch(err => console.error('[PWA] SW register error:', err));
        });
      }

      window.__PWA_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__PWA_PROMPT__ = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });
      window.addEventListener('appinstalled', () => {
        window.__PWA_PROMPT__ = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </body>
</html>
